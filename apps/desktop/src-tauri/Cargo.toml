[package]
name = "knock-desktop"
# The app's one version: tauri.conf.json has none, so the installer, the
# exe's file version and /v1/health all use this.
version = "0.3.0-beta.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
knock-core = { path = "../../../crates/knock-core" }
tauri = { version = "2.12.4", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.3", features = ["net", "rt", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The same GTK stack tauri/tao use, so the strip's GtkWindow can be handed to
# gtk-layer-shell (docs/adr/0037-linux-port.md).
gtk = "0.18.2"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2.190"
# Idle time on Wayland: ext-idle-notify-v1 (staging), its own connection.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
