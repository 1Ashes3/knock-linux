<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Knock strip</title>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			/* Spike A test target: 48x48, bottom-right with 8px padding inside a 192x64 strip. */
			#target {
				position: fixed;
				right: 8px;
				bottom: 8px;
				width: 48px;
				height: 48px;
				box-sizing: border-box;
				border: 3px solid #1a1a1a;
				border-radius: 10px;
				background: #f2a93b;
				color: #1a1a1a;
				font: bold 18px/42px system-ui, sans-serif;
				text-align: center;
				padding: 0;
				user-select: none;
				cursor: pointer;
			}
			/* Spike C session label: left of the target, not a hit region (clicks fall through). */
			#label {
				position: fixed;
				right: 64px;
				bottom: 20px;
				max-width: 120px;
				box-sizing: border-box;
				padding: 2px 6px;
				border-radius: 6px;
				background: rgba(20, 20, 20, 0.75);
				color: #ffffff;
				font: 12px/20px system-ui, sans-serif;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				pointer-events: none;
				user-select: none;
			}
			#target:hover {
				background: #4fc3a1;
				border-color: #ffffff;
				outline: 2px solid #1a1a1a;
			}
		</style>
	</head>
	<body>
		<div id="label">no sessions</div>
		<button id="target" type="button" tabindex="-1" aria-label="Test target, clicks: 0">0</button>
		<script type="module" src="./index.ts"></script>
	</body>
</html>
