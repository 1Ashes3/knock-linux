[package]
name = "knock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The one disk helper: reading a pack folder safely (packs::read_folder).
# Off by default, so the engine itself stays free of I/O (§7.1).
fs = ["dep:libc"]
# .knockpack files are zips: packs::read_zip and packs::write_zip.
zip = ["dep:zip", "dep:flate2"]

[dependencies]
# Plain deflate only, on the flate2 already in the tree; other methods are refused.
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"], optional = true }
# Its pure-Rust backend (miniz_oxide), so no C zlib is needed.
flate2 = { version = "1.1.10", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }

# read_folder opens pack files with O_NOFOLLOW | O_NONBLOCK (feature "fs").
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", optional = true }
