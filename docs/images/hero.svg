<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t">
<title id="t">Four Claude Code sessions on the Windows taskbar: a sleeping fox, a rabbit holding up a done card, an owl that stopped with an error, and a cat knocking because it needs permission</title>
<style>
	text { font: 600 12.5px "Segoe UI", system-ui, -apple-system, sans-serif; }
	.cat-paw_r { animation: tap 1s ease-in-out infinite; transform-origin: 37px 57px; }
	.cat-head, .cat-ear_l, .cat-ear_r, .cat-eyes_open { animation: tilt 1s ease-in-out infinite; transform-origin: 32px 34px; }
	.ring { animation: ring 1s ease-out infinite; opacity: 0; }
	.ring2 { animation-delay: .24s; }
	.ask { animation: ask 1s ease-in-out infinite; }
	.fox-body { animation: breathe 4s ease-in-out infinite; transform-origin: 32px 58px; }
	.z { animation: z 3s ease-in-out infinite; opacity: 0; }
	.z2 { animation-delay: 1.5s; }
	.rabbit-eyes_open { animation: blink 4s steps(1) infinite; }
	@keyframes tap { 0%,48%,100% { transform: translate(2px,-16px) scale(1); } 12%,36% { transform: translate(2px,-16px) scale(1.25); } }
	@keyframes tilt { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(2deg); } }
	@keyframes ring { 0% { opacity: .9; transform: translate(0,0); } 100% { opacity: 0; transform: translate(6px,-2px); } }
	@keyframes ask { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
	@keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }
	@keyframes z { 0% { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px,-22px); } }
	@keyframes blink { 0%,74%,88%,100% { opacity: 1; } 75%,87% { opacity: 0; } }
	@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ring, .z { opacity: 1; } }
</style>
